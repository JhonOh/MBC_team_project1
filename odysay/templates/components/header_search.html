<div class="site-search"
     data-site-search
     data-suggest-url="{{ url_for('search.suggest') }}">

    <!-- 항상 표시되는 검색 입력창 -->
    <form action="{{ url_for('search.results') }}"
          method="get"
          role="search"
          aria-label="여행지와 커뮤니티 검색">

        <div class="site-search-input-row">
            <input
                type="search"
                name="q"
                minlength="2"
                maxlength="100"
                autocomplete="off"
                placeholder="여행지·커뮤니티 검색"
                aria-label="검색어"
                required>

            <button type="submit" class="site-search-submit">
                검색
            </button>
        </div>
    </form>

    <!-- 입력할 때만 표시되는 자동완성 -->
    <div class="site-search-panel" hidden>
        <p class="site-search-status"
           role="status"
           aria-live="polite">
        </p>

        <div class="site-search-suggestions"></div>

        <a class="site-search-all" hidden>
            검색 결과 전체보기 →
        </a>
    </div>
</div>
